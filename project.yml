name: Convene
options:
  bundleIdPrefix: co.blode
  deploymentTarget:
    macOS: "15.0"
    iOS: "17.0"
  createIntermediateGroups: true
  defaultConfig: Debug
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.9"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "84FUKET6NJ"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_STRICT_CONCURRENCY: minimal

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "2.0.0"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.8.1"

targets:
  Convene:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Shared
      - path: Convene
        excludes:
          - "Info.plist"
          - "Convene.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.blode.convene
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Convene/Info.plist
        CODE_SIGN_ENTITLEMENTS: Convene/Convene.entitlements
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.productivity"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    dependencies:
      - package: KeyboardShortcuts
        product: KeyboardShortcuts
      - package: Sparkle
        product: Sparkle

  ConveneTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: ConveneTests
        excludes:
          - "Fixtures/**"
      - path: ConveneTests/Fixtures
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.blode.convene.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Convene

  # The iPhone app. iOS can't tap another app's audio, so this records the room through the mic as
  # a single diarized stream rather than the Mac's mic + system-audio pair. Everything below the
  # capture layer — session, transcriber, WAL, markdown — is the same Shared code.
  ConveneMobile:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Shared
      - path: ConveneMobile
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.blode.convene.mobile
        # The target stays ConveneMobile to keep the scheme, CI job, and docs stable, but the
        # product is just Convene — so the built bundle and Xcode Organizer match the display
        # name users already see. Different platform to the Mac target, so the name isn't a clash.
        PRODUCT_NAME: Convene
        # Its own build number, not the shared one: TestFlight rejects a build number it has already
        # seen, so this has to climb on every upload — and it shouldn't drag the Mac app's version
        # along with it each time.
        CURRENT_PROJECT_VERSION: "5"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_FILE: ConveneMobile/Info.plist
        # iPhone only: the layouts are single-column and the whole thing assumes a phone on a table.
        TARGETED_DEVICE_FAMILY: "1"
        # Hardened runtime is a macOS notarization setting; the shared base turns it on for the Mac app.
        ENABLE_HARDENED_RUNTIME: NO

schemes:
  Convene:
    build:
      targets:
        Convene: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ConveneTests
    archive:
      config: Release

  ConveneMobile:
    build:
      targets:
        ConveneMobile: all
    run:
      config: Debug
    archive:
      config: Release
