name: Convene
options:
  bundleIdPrefix: co.blode
  deploymentTarget:
    macOS: "15.0"
    iOS: "17.0"
  createIntermediateGroups: true
  defaultConfig: Debug
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.1"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "84FUKET6NJ"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_STRICT_CONCURRENCY: minimal

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "2.0.0"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.8.1"
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    from: "0.14.4"

targets:
  Convene:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Shared
      - path: Convene
        excludes:
          - "Info.plist"
          - "Convene.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.blode.convene
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Convene/Info.plist
        CODE_SIGN_ENTITLEMENTS: Convene/Convene.entitlements
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.productivity"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    dependencies:
      - package: KeyboardShortcuts
        product: KeyboardShortcuts
      - package: Sparkle
        product: Sparkle
      - package: FluidAudio
        product: FluidAudio

  ConveneMobile:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Shared
      - path: ConveneMobile
        excludes:
          - "Info.plist"
          - "ConveneMobile.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.blode.convene.mobile
        INFOPLIST_FILE: ConveneMobile/Info.plist
        CODE_SIGN_ENTITLEMENTS: ConveneMobile/ConveneMobile.entitlements
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
    dependencies:
      - package: FluidAudio
        product: FluidAudio

schemes:
  Convene:
    build:
      targets:
        Convene: all
    run:
      config: Debug
    archive:
      config: Release

  ConveneMobile:
    build:
      targets:
        ConveneMobile: all
    run:
      config: Debug
    archive:
      config: Release
